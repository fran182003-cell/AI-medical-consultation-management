spring.application.name=TFG_telematica
server.port=8081
spring.datasource.driverClassName=org.h2.Driver


spring.datasource.url=jdbc:h2:file:./data/tfgdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
# Credenciales de demostracion para la base de datos H2 local (solo desarrollo)
spring.datasource.password=123


spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Consola H2: solo para desarrollo. Desactivar en cualquier despliegue real.
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


jwt.expiration=86400000
# Rutas de las claves (NO se suben al repositorio). Se pueden sobreescribir con las
# variables de entorno RUTA_CLAVE_MAESTRA y RUTA_CLAVE_JWT. Ver README.

app.tfg.seguridad.ruta-claves=${RUTA_CLAVE_MAESTRA:./claves/tink_keyset.json}
jwt.secret.path=${RUTA_CLAVE_JWT:./claves/jwt_secret.key}

# Log de seguridad que vigila el agente SOC
app.seguridad.log-file=${RUTA_LOG_SEGURIDAD:log_seguridad.txt}

# URL de la Inteligencia Artificial (Ngrok). Sustituir "xxxx" por el tunel activo
# o definir la variable de entorno IA_URL.
app.ia.url=${IA_URL:https://xxxx.ngrok-free.dev/ia/generar-respuesta}
